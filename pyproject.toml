[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chromadb-mysql-backend"
version = "0.1.0"
description = "Switchable HeatWave MySQL backends for mempalace: a drop-in ChromaDB-API-compatible vector store (MySQL 9 VECTOR + in-DB ML_EMBED) and a drop-in temporal knowledge-graph store — both opt-in, both leaving the standard SQLite/ChromaDB paths untouched when disabled."
requires-python = ">=3.10"
dependencies = [
  # pymysql (pure-Python driver) is required at runtime in MySQL mode; kept out
  # of hard deps so the package imports cleanly for unit tests / the switch shim.
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
# OPTIONAL client-side fallback only (MEMPALACE_EMBED_MODE=client); the default
# db mode embeds in HeatWave via ML_EMBED and needs neither torch nor this extra.
embed = ["sentence-transformers>=2.2"]
test = ["pytest>=7"]

[project.entry-points."mempalace.backends"]
mysql = "chromadb_mysql_backend.mempalace_backend:MySQLBackend"

[tool.hatch.build.targets.wheel]
# The backend implementation package, the runtime import-redirector, and the
# .pth that auto-activates the redirector at interpreter startup.
include = [
  "chromadb_mysql_backend/**",
  "chromadb_switch.py",
  "activate-chromadb-mysql.pth",
  # Sibling backend: the temporal knowledge graph on the same HeatWave MySQL,
  # its first-party class-swap switch, and the .pth that auto-activates it.
  "mempalace_kg_mysql/**",
  "mempalace_kg_switch.py",
  "activate-mempalace-kg-mysql.pth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
